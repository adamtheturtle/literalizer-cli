# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
default_install_hook_types = [
  "pre-commit",
  "pre-push"
  ]

[[repos]]
repo = "meta"
hooks = [
  {
    id = "check-useless-excludes",
    stages = ["pre-commit"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-added-large-files",
    stages = ["pre-commit"]
  },
  {
    id = "check-case-conflict",
    stages = ["pre-commit"]
  },
  {
    id = "check-executables-have-shebangs",
    stages = ["pre-commit"]
  },
  {
    id = "check-merge-conflict",
    stages = ["pre-commit"]
  },
  {
    id = "check-shebang-scripts-are-executable",
    stages = ["pre-commit"]
  },
  {
    id = "check-symlinks",
    stages = ["pre-commit"]
  },
  {
    id = "check-json",
    stages = ["pre-commit"]
  },
  {
    id = "check-toml",
    stages = ["pre-commit"]
  },
  {
    id = "check-vcs-permalinks",
    stages = ["pre-commit"]
  },
  {
    id = "check-yaml",
    stages = ["pre-commit"]
  },
  {
    id = "end-of-file-fixer",
    priority = 100,
    stages = ["pre-commit"]
  },
  {
    id = "trailing-whitespace",
    priority = 110,
    stages = ["pre-commit"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  {
    id = "rst-directive-colons",
    stages = ["pre-commit"]
  },
  {
    id = "rst-inline-touching-normal",
    stages = ["pre-commit"]
  },
  {
    id = "text-unicode-replacement-char",
    stages = ["pre-commit"]
  },
  {
    id = "rst-backticks",
    stages = ["pre-commit"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "actionlint",
    priority = 500,
    name = "actionlint",
    entry = "uv run --group=dev actionlint",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "shellcheck",
    priority = 500,
    name = "shellcheck",
    entry = "uv run --group=dev shellcheck --shell=bash",
    language = "python",
    types_or = ["shell"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "shfmt",
    priority = 120,
    name = "shfmt",
    entry = "uv run --group=dev shfmt --write --space-redirects --indent=4",
    language = "python",
    types_or = ["shell"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "pydocstringformatter",
    priority = 130,
    name = "pydocstringformatter",
    entry = "uv run --group=dev pydocstringformatter",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "mypy",
    priority = 520,
    name = "mypy",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m mypy",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "check-manifest",
    priority = 520,
    name = "check-manifest",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m check_manifest",
    language = "python",
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyright",
    priority = 520,
    name = "pyright",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m pyright .",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "deptry",
    priority = 510,
    name = "deptry",
    entry = "uv run --group=dev -m deptry src/",
    language = "python",
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "vulture",
    priority = 510,
    name = "vulture",
    entry = "uv run --group=dev -m vulture .",
    language = "python",
    types_or = ["python"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "pyroma",
    priority = 510,
    name = "pyroma",
    entry = "uv run --group=dev -m pyroma --min 10 .",
    language = "python",
    pass_filenames = false,
    types_or = ["toml"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "ruff-check-fix",
    priority = 140,
    name = "Ruff check fix",
    entry = "uv run --group=dev -m ruff check --fix",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "ruff-format-fix",
    priority = 150,
    name = "Ruff format",
    entry = "uv run --group=dev -m ruff format",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "pylint",
    name = "pylint",
    entry = "uv run --group=dev -m pylint src/ tests/ docs/",
    language = "python",
    stages = ["manual"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "strict-kwargs-fix",
    priority = 160,
    name = "strict-kwargs",
    entry = "uv run --group=dev strict-kwargs check --fix",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"],
    require_serial = true
  },
  {
    id = "no-defaults",
    priority = 510,
    name = "no-defaults",
    entry = "uv run --group=dev no-defaults",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"],
    require_serial = true
  },
  {
    id = "pyproject-fmt-fix",
    priority = 170,
    name = "pyproject-fmt",
    entry = "uv run --group=dev pyproject-fmt",
    language = "python",
    types_or = ["toml"],
    files = "pyproject.toml",
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "vale-sync",
    priority = 180,
    name = "vale sync",
    entry = "uv run --group=dev vale sync",
    language = "python",
    pass_filenames = false,
    files = '(\.(rst|md)$|^\.vale\.ini$)',
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "snapper",
    priority = 190,
    name = "snapper",
    entry = "uv run --group=dev snapper --native --max-width 0 --in-place",
    language = "python",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "vale",
    priority = 500,
    name = "vale",
    entry = "uv run --group=dev vale",
    language = "python",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "doc8",
    priority = 500,
    name = "doc8",
    entry = "uv run --group=dev -m doc8",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "linkcheck",
    name = "linkcheck",
    entry = "uv run --group=dev sphinx-build -M linkcheck docs/source docs/build -W -d docs/build/.doctrees-linkcheck",
    language = "python",
    types_or = ["rst", "markdown"],
    stages = ["manual"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "spelling",
    name = "spelling",
    entry = "uv run --group=dev sphinx-build -M spelling docs/source docs/build -W -d docs/build/.doctrees-spelling",
    language = "python",
    types_or = ["rst", "markdown"],
    stages = ["manual"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "interrogate",
    priority = 510,
    name = "interrogate",
    entry = "uv run --group=dev -m interrogate",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "ty",
    priority = 520,
    name = "ty",
    stages = ["pre-push"],
    entry = "uv run --group=dev ty check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyrefly",
    priority = 520,
    name = "pyrefly",
    stages = ["pre-push"],
    entry = "uv run --group=dev pyrefly check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyrefly-coverage",
    priority = 530,
    name = "pyrefly coverage",
    stages = ["pre-push"],
    entry = "uv run --group=dev pyrefly coverage check --strict --fail-under 100",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "yamlfix",
    priority = 200,
    name = "yamlfix",
    entry = "uv run --group=dev yamlfix",
    language = "python",
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "zizmor",
    priority = 500,
    name = "zizmor",
    entry = "uv run --group=dev zizmor --strict-collection .github",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "docs",
    name = "Build Documentation",
    entry = "uv run --group=dev sphinx-build -M html docs/source docs/build -W",
    language = "python",
    stages = ["manual"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "sphinx-lint",
    priority = 500,
    name = "sphinx-lint",
    entry = "uv run --group=dev sphinx-lint --enable=all --disable=line-too-long --ignore=docs/build",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "uv-lock",
    priority = 510,
    name = "uv lock",
    entry = "uv lock --locked",
    language = "python",
    pass_filenames = false,
    files = '(^pyproject\.toml$|^uv\.lock$)',
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  }
]
